<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 182" role="img" aria-label="Tock the Chronos hourglass mascot, at rest">
  <defs>
    <pattern id="ink-slate" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.5" fill="#8D97AC"/></pattern>
    <pattern id="ink-slate-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.02" fill="#8D97AC"/></pattern>
    <pattern id="ink-amber" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.5" fill="#E8A33D"/></pattern>
    <pattern id="ink-amber-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.08" fill="#E8A33D"/></pattern>
    <pattern id="ink-white" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(75)"><circle cx="1.5" cy="1.5" r="1.56" fill="#F2EDE3"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip-top"><path d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z"/></clipPath>
    <clipPath id="clip-bot"><path d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z"/></clipPath>
    
  </defs>
  <style>
    /* Tock animates himself. Named groups only — nothing here touches the art.
       Works inline AND as &lt;img src="mascot.svg"&gt;. */
    #body{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
    #eye{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite}
    /* the halftone pitch is 3 user units, so a 3-unit loop scrolls seamlessly */
    #stream{animation:fall .55s linear infinite}
    #sand-top{transform-box:fill-box;transform-origin:center;animation:drain 14s linear infinite}
    #sand-bottom{transform-box:fill-box;transform-origin:center;animation:heap 14s linear infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @keyframes fall{from{transform:translateY(0)}to{transform:translateY(3px)}}
    @keyframes drain{from{transform:translateY(0)}to{transform:translateY(44px)}}
    @keyframes heap{from{transform:translateY(0)}to{transform:translateY(-22px)}}
    @media (prefers-reduced-motion: reduce){
      #body,#eye,#stream,#sand-top,#sand-bottom{animation:none!important}
      #sand-top{transform:translateY(18px)}#sand-bottom{transform:translateY(-9px)}
    }
  </style>
  <rect id="ground" width="150" height="182" fill="#1E2430"/>

  <g id="body"><g id="plate-slate" transform="translate(-0.6 0.5)"><g id="limbs"><path id="arm-l" d="M34 108 q -19 6 -20 22" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
       <path id="arm-r" d="M116 108 q 19 6 20 22" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
    <g id="legs"><path d="M57 134 V152 M93 134 V152" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/>
    <path d="M51 159 h15 M99 159 h-15" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/></g></g>
    <g id="frame"><path id="cap-top" d="M16 22 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/><path id="cap-bottom" d="M16 126 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/></g>
    <g id="glass"><path id="bulb-top" d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/><path id="bulb-bottom" d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/></g></g>
  <g id="plate-amber" transform="translate(1.2 -0.8)"><g id="sand-top-wrap" clip-path="url(#clip-top)"><path id="sand-top" d="M-20 45.9 Q 75 57.9 170 45.9 L 170 80 L -20 80 Z" fill="url(#ink-amber)"/></g><rect id="stream" x="73.3" y="74" width="3.4" height="38" fill="url(#ink-amber)"/><g id="sand-bottom-wrap" clip-path="url(#clip-bot)"><path id="sand-bottom" d="M-20 114.8 Q 75 99.8 170 114.8 L 170 126 L -20 126 Z" fill="url(#ink-amber)"/></g></g>
  <g id="plate-white" transform="translate(0 0)"><g id="eye" data-mood="idle">
      <circle cx="58" cy="100" r="10.0" fill="url(#ink-white)"/><circle cx="92" cy="100" r="10.0" fill="url(#ink-white)"/><circle cx="58.0" cy="100.0" r="4.4" fill="#1E2430"/><circle cx="92.0" cy="100.0" r="4.4" fill="#1E2430"/>
      <g id="brow"><path d="M48.5 84.7 Q 58 80.1 67.5 82.3" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/><path d="M82.5 82.3 Q 92 80.1 101.5 84.7" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/></g></g></g></g>
  <g id="flecks"><circle cx="97.9" cy="69.5" r="1.42" fill="#8D97AC" opacity="0.52"/><circle cx="121.3" cy="128.1" r="0.59" fill="#E8A33D" opacity="0.39"/><circle cx="122.1" cy="16.9" r="1.32" fill="#8D97AC" opacity="0.63"/><circle cx="66.1" cy="165.4" r="1.36" fill="#8D97AC" opacity="0.48"/><circle cx="93.3" cy="98.8" r="1.08" fill="#8D97AC" opacity="0.55"/><circle cx="68.4" cy="30.4" r="0.52" fill="#E8A33D" opacity="0.59"/><circle cx="39.3" cy="14.3" r="0.52" fill="#E8A33D" opacity="0.36"/><circle cx="42.2" cy="10.0" r="0.97" fill="#8D97AC" opacity="0.32"/><circle cx="90.9" cy="58.7" r="1.49" fill="#E8A33D" opacity="0.61"/><circle cx="77.2" cy="5.0" r="0.81" fill="#8D97AC" opacity="0.27"/><circle cx="58.0" cy="21.3" r="1.49" fill="#E8A33D" opacity="0.50"/><circle cx="50.0" cy="1.6" r="0.54" fill="#8D97AC" opacity="0.52"/><circle cx="6.0" cy="164.2" r="0.85" fill="#E8A33D" opacity="0.62"/><circle cx="46.7" cy="153.4" r="1.58" fill="#C0506A" opacity="0.63"/></g>
  <rect id="grain" width="150" height="182" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
