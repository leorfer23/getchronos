      <g id="lid"><path d="M84.5 93.4 A 10 10 0 0 1 99.5 93.4 Z" fill="url(#ink-slate)"/></g>
      <g id="brow"><path d="M48.5 76.3 Q 58 77.1 67.5 84.7" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/><path d="M82.5 87.2 Q 92 81.6 101.5 82.8" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/></g></g></g>
  <g id="flecks"><circle cx="58.2" cy="42.2" r="1.04" fill="#8D97AC" opacity="0.56"/><circle cx="144.4" cy="23.6" r="1.31" fill="#8D97AC" opacity="0.48"/><circle cx="10.3" cy="71.8" r="1.55" fill="#C0506A" opacity="0.47"/><circle cx="108.5" cy="126.8" r="1.33" fill="#C0506A" opacity="0.63"/><circle cx="90.0" cy="154.2" r="0.90" fill="#C0506A" opacity="0.29"/><circle cx="8.3" cy="160.5" r="1.36" fill="#E8A33D" opacity="0.61"/><circle cx="110.9" cy="86.0" r="1.58" fill="#8D97AC" opacity="0.46"/><circle cx="74.8" cy="85.9" r="0.77" fill="#C0506A" opacity="0.26"/><circle cx="10.7" cy="24.0" r="0.94" fill="#E8A33D" opacity="0.43"/><circle cx="133.4" cy="3.9" r="0.63" fill="#8D97AC" opacity="0.47"/><circle cx="15.6" cy="44.3" r="0.76" fill="#8D97AC" opacity="0.52"/><circle cx="100.4" cy="147.5" r="0.95" fill="#8D97AC" opacity="0.60"/><circle cx="84.6" cy="37.1" r="1.55" fill="#C0506A" opacity="0.42"/><circle cx="92.9" cy="174.3" r="0.63" fill="#E8A33D" opacity="0.36"/></g>
  <rect id="grain" width="150" height="182" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
