<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 182" role="img" aria-label="Tock the Chronos hourglass mascot, alert">
  <defs>
    <pattern id="ink-slate" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.5" fill="#8D97AC"/></pattern>
    <pattern id="ink-slate-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.02" fill="#8D97AC"/></pattern>
    <pattern id="ink-amber" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.5" fill="#E8A33D"/></pattern>
    <pattern id="ink-amber-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.08" fill="#E8A33D"/></pattern>
    <pattern id="ink-white" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(75)"><circle cx="1.5" cy="1.5" r="1.56" fill="#F2EDE3"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip-top"><path d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z"/></clipPath>
    <clipPath id="clip-bot"><path d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z"/></clipPath>
    
  </defs>
  <rect id="ground" width="150" height="182" fill="#1E2430"/>

  <g id="plate-slate" transform="translate(-0.6 0.5)"><g id="limbs"><path id="arm-l" d="M34 108 q -19 6 -20 22" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
       <path id="arm-r" d="M116 108 q 19 6 20 22" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
    <g id="legs"><path d="M57 134 V152 M93 134 V152" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/>
    <path d="M51 159 h15 M99 159 h-15" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/></g></g>
    <g id="frame"><path id="cap-top" d="M16 22 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/><path id="cap-bottom" d="M16 126 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/></g>
    <g id="glass"><path id="bulb-top" d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/><path id="bulb-bottom" d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/></g></g>
  <g id="plate-amber" transform="translate(1.2 -0.8)"><g id="sand-top-wrap" clip-path="url(#clip-top)"><path id="sand-top" d="M-20 32.9 Q 75 44.9 170 32.9 L 170 80 L -20 80 Z" fill="url(#ink-amber)"/></g><rect id="stream" x="73.3" y="74" width="3.4" height="38" fill="url(#ink-amber)"/><g id="sand-bottom-wrap" clip-path="url(#clip-bot)"><path id="sand-bottom" d="M-20 120.9 Q 75 105.9 170 120.9 L 170 126 L -20 126 Z" fill="url(#ink-amber)"/></g></g>
  <g id="plate-white" transform="translate(0 0)"><g id="eye" data-mood="alert">
      <circle cx="58" cy="100" r="11.4" fill="url(#ink-white)"/><circle cx="92" cy="100" r="11.4" fill="url(#ink-white)"/><circle cx="58.0" cy="98.4" r="3.8" fill="#1E2430"/><circle cx="92.0" cy="98.4" r="3.8" fill="#1E2430"/>
      <g id="brow"><path d="M48.5 78.6 Q 58 77.6 67.5 83.4" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/><path d="M82.5 83.4 Q 92 77.6 101.5 78.6" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/></g></g></g>
  <g id="flecks"><circle cx="128.9" cy="169.5" r="1.40" fill="#8D97AC" opacity="0.26"/><circle cx="110.7" cy="18.1" r="0.62" fill="#E8A33D" opacity="0.54"/><circle cx="68.6" cy="146.0" r="0.66" fill="#8D97AC" opacity="0.36"/><circle cx="12.7" cy="174.3" r="0.86" fill="#C0506A" opacity="0.59"/><circle cx="87.2" cy="74.7" r="1.13" fill="#8D97AC" opacity="0.52"/><circle cx="28.6" cy="43.4" r="1.52" fill="#E8A33D" opacity="0.50"/><circle cx="22.5" cy="98.9" r="0.78" fill="#C0506A" opacity="0.36"/><circle cx="62.9" cy="25.7" r="1.17" fill="#C0506A" opacity="0.62"/><circle cx="148.3" cy="120.9" r="1.55" fill="#8D97AC" opacity="0.27"/><circle cx="22.1" cy="39.4" r="1.53" fill="#E8A33D" opacity="0.37"/><circle cx="131.8" cy="105.4" r="1.33" fill="#8D97AC" opacity="0.59"/><circle cx="26.0" cy="137.7" r="0.74" fill="#E8A33D" opacity="0.34"/><circle cx="100.9" cy="77.6" r="1.18" fill="#C0506A" opacity="0.61"/><circle cx="6.9" cy="134.7" r="1.51" fill="#E8A33D" opacity="0.40"/></g>
  <rect id="grain" width="150" height="182" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
