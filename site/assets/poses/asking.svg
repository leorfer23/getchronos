  <g id="flecks"><circle cx="89.3" cy="142.2" r="1.03" fill="#E8A33D" opacity="0.37"/><circle cx="121.1" cy="86.9" r="1.07" fill="#E8A33D" opacity="0.44"/><circle cx="44.2" cy="150.2" r="1.33" fill="#8D97AC" opacity="0.51"/><circle cx="146.7" cy="164.7" r="1.11" fill="#C0506A" opacity="0.60"/><circle cx="98.2" cy="158.6" r="0.55" fill="#E8A33D" opacity="0.61"/><circle cx="137.3" cy="177.3" r="1.32" fill="#C0506A" opacity="0.54"/><circle cx="54.9" cy="64.5" r="1.54" fill="#8D97AC" opacity="0.57"/><circle cx="49.1" cy="163.4" r="0.77" fill="#E8A33D" opacity="0.45"/><circle cx="21.5" cy="56.3" r="0.73" fill="#8D97AC" opacity="0.33"/><circle cx="127.4" cy="118.3" r="0.84" fill="#C0506A" opacity="0.31"/><circle cx="91.2" cy="85.3" r="1.04" fill="#C0506A" opacity="0.27"/><circle cx="69.7" cy="145.8" r="1.31" fill="#C0506A" opacity="0.35"/><circle cx="11.8" cy="25.4" r="0.63" fill="#E8A33D" opacity="0.26"/><circle cx="46.3" cy="154.3" r="0.67" fill="#8D97AC" opacity="0.41"/></g>
  <rect id="grain" width="150" height="182" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
