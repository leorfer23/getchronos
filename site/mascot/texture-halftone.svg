<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Tileable risograph halftone paper texture">
  <defs>
    <pattern id="screen" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.05" fill="#8D97AC"/>
    </pattern>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect id="ground" width="96" height="96" fill="#1E2430"/>
  <rect id="halftone" width="96" height="96" fill="url(#screen)" opacity="0.13"/>
  <g id="flecks">
    <circle cx="21" cy="14" r="0.8" fill="#C0506A" opacity="0.45"/>
    <circle cx="68" cy="37" r="0.6" fill="#E8A33D" opacity="0.40"/>
    <circle cx="44" cy="72" r="0.9" fill="#8D97AC" opacity="0.35"/>
    <circle cx="81" cy="61" r="0.5" fill="#C0506A" opacity="0.30"/>
  </g>
  <rect id="fibre-grain" width="96" height="96" filter="url(#fibre)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
