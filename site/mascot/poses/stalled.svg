<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 182" role="img" aria-label="Tock the Chronos hourglass mascot, stalled">
  <defs>
    <pattern id="ink-slate" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.5" fill="#8D97AC"/></pattern>
    <pattern id="ink-slate-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="1.5" cy="1.5" r="1.02" fill="#8D97AC"/></pattern>
    <pattern id="ink-amber" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.5" fill="#E8A33D"/></pattern>
    <pattern id="ink-amber-lt" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="1.5" cy="1.5" r="1.08" fill="#E8A33D"/></pattern>
    <pattern id="ink-white" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(75)"><circle cx="1.5" cy="1.5" r="1.56" fill="#F2EDE3"/></pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="clip-top"><path d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z"/></clipPath>
    <clipPath id="clip-bot"><path d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z"/></clipPath>
    
  </defs>
  <rect id="ground" width="150" height="182" fill="#1E2430"/>

  <g id="plate-slate" transform="translate(-0.6 0.5)"><g id="limbs">
    <path id="arm-l" d="M34 108 q -12 12 -11 26" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
    <path id="arm-r" d="M116 108 q 12 12 11 26" fill="none" stroke="url(#ink-slate)" stroke-width="9" stroke-linecap="round"/>
    <g id="legs"><path d="M57 134 V152 M93 134 V152" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/>
    <path d="M51 159 h15 M99 159 h-15" stroke="url(#ink-slate)" stroke-width="11" stroke-linecap="round"/></g></g>
    <g id="frame"><path id="cap-top" d="M16 22 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/><path id="cap-bottom" d="M16 126 a8 8 0 0 1 8 -8 h102 a8 8 0 0 1 0 16 h-102 a8 8 0 0 1 -8 -8 Z" fill="url(#ink-slate)"/></g>
    <g id="glass"><path id="bulb-top" d="M28 30 C 26 52, 58 62, 69 74 L81 74 C 92 62, 124 52, 122 30 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/><path id="bulb-bottom" d="M69 76 C 58 88, 26 96, 28 118 L122 118 C 124 96, 92 88, 81 76 Z" fill="none" stroke="url(#ink-slate)" stroke-width="2.6"/></g></g>
  <g id="plate-amber" transform="translate(1.2 -0.8)"><g id="sand-top-wrap" clip-path="url(#clip-top)"><path id="sand-top" d="M-20 50.1 Q 75 62.1 170 50.1 L 170 80 L -20 80 Z" fill="url(#ink-amber)"/></g><g id="stream"></g><g id="sand-bottom-wrap" clip-path="url(#clip-bot)"><path id="sand-bottom" d="M-20 113.0 Q 75 98.0 170 113.0 L 170 126 L -20 126 Z" fill="url(#ink-amber)"/></g></g>
  <g id="plate-white" transform="translate(0 0)"><g id="eye" data-mood="stalled">
      <circle cx="58" cy="100" r="10.0" fill="url(#ink-white)"/><circle cx="92" cy="100" r="10.0" fill="url(#ink-white)"/><circle cx="58.0" cy="103.2" r="4.2" fill="#1E2430"/><circle cx="92.0" cy="103.2" r="4.2" fill="#1E2430"/>
      <g id="lid"><path d="M50.9 93.0 A 10 10 0 0 1 65.1 93.0 Z" fill="url(#ink-slate)"/><path d="M84.9 93.0 A 10 10 0 0 1 99.1 93.0 Z" fill="url(#ink-slate)"/></g>
      <g id="brow"><path d="M48.5 86.8 Q 58 80.6 67.5 81.2" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/><path d="M82.5 81.2 Q 92 80.6 101.5 86.8" fill="none" stroke="url(#ink-slate)" stroke-width="3.2" stroke-linecap="round"/></g>
      <g id="bags"><path d="M51.0 112.5 q 7.0 4.5 14.0 0" fill="none" stroke="url(#ink-slate-lt)" stroke-width="2.2" stroke-linecap="round"/><path d="M85.0 112.5 q 7.0 4.5 14.0 0" fill="none" stroke="url(#ink-slate-lt)" stroke-width="2.2" stroke-linecap="round"/></g></g></g>
  <g id="flecks"><circle cx="10.0" cy="87.6" r="0.90" fill="#E8A33D" opacity="0.25"/><circle cx="6.1" cy="107.0" r="1.51" fill="#C0506A" opacity="0.64"/><circle cx="72.7" cy="39.4" r="1.56" fill="#C0506A" opacity="0.55"/><circle cx="0.8" cy="26.2" r="1.45" fill="#8D97AC" opacity="0.40"/><circle cx="127.8" cy="125.6" r="1.25" fill="#8D97AC" opacity="0.35"/><circle cx="126.4" cy="5.9" r="0.59" fill="#C0506A" opacity="0.26"/><circle cx="139.2" cy="90.7" r="0.66" fill="#C0506A" opacity="0.32"/><circle cx="109.8" cy="139.2" r="0.71" fill="#E8A33D" opacity="0.52"/><circle cx="26.6" cy="160.7" r="1.14" fill="#E8A33D" opacity="0.42"/><circle cx="116.0" cy="85.6" r="1.23" fill="#8D97AC" opacity="0.25"/><circle cx="144.1" cy="107.5" r="1.16" fill="#C0506A" opacity="0.55"/><circle cx="70.0" cy="23.0" r="1.07" fill="#8D97AC" opacity="0.33"/><circle cx="31.2" cy="125.1" r="1.07" fill="#E8A33D" opacity="0.36"/><circle cx="6.2" cy="52.3" r="1.16" fill="#8D97AC" opacity="0.46"/></g>
  <rect id="grain" width="150" height="182" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
