name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    # macOS only: it is where the sandbox (Seatbelt), swiftc and say(1) exist, so it is the only
    # runner that can run every test. Ubuntu ran beside it until 2026-11: across the 96 failed runs
    # before that, it never failed on a product bug macOS missed — only on a macOS-only assertion.
    #
    # The whole suite (npm run test:all: unit tests, evals, ptys, multi-host links, swiftc, a real
    # browser) split over three runners; the file list is sorted slow-first, and node shards it
    # round-robin, so each runner gets a third of the slow files.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        if: matrix.shard == 1
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test (shard ${{ matrix.shard }}/3)
        run: node scripts/test.mjs --all --test-shard=${{ matrix.shard }}/3
