name: Bug report
description: Something the daemon did that it should not have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything exploitable, do not open an issue — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest repro
      description: The command, the endpoint, or the ticket that triggers it.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from chronos.err.log
      description: The real error is usually there. Redact anything that came out of your own repos.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: macOS and node version
      placeholder: "macOS 15.5, node 22.14"
    validations:
      required: true
