<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide — Chronos</title>
<link rel="icon" href="/phone-icon.png">
<style>
  /* The Desk's token set (static/desk.html), so the guide reads as the same product. */
  :root {
    --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#EBEEEB; --ink:#1B211E; --muted:#67716B;
    --faint:#9AA49E; --line:#DEE3DF; --accent:#2E7D64; --accent-ink:#FFFFFF; --accent-soft:#E1EEE8;
    --code-bg:#EBEEEB;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#121614; --surface:#1B201D; --surface-2:#232925; --ink:#E6ECE8; --muted:#93A099;
    --faint:#6B7671; --line:#2B322E; --accent:#56B693; --accent-ink:#0D1511; --accent-soft:#1F332B;
    --code-bg:#232925;
  } }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:16.5px/1.6 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  header.bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; height:50px; padding:0 16px;
    background:var(--surface); border-bottom:1px solid var(--line); white-space:nowrap; }
  header.bar a { color:var(--muted); text-decoration:none; font-size:15px; }
  header.bar a:hover { color:var(--ink); }
  .wordmark { font-weight:700; letter-spacing:-.02em; color:var(--ink) !important; }
  .wordmark span { color:var(--accent); }
  .sp { flex:1; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; overflow-wrap:break-word; }
  main h1 { font-size:30px; line-height:1.2; letter-spacing:-.02em; margin:8px 0 16px; }
  main h2 { font-size:21px; line-height:1.3; margin:32px 0 10px; padding-top:8px; border-top:1px solid var(--line); }
  main h3 { font-size:17.5px; margin:24px 0 8px; }
  main p, main ul, main ol { margin:10px 0; }
  main ul, main ol { padding-left:22px; }
  main li { margin:4px 0; }
  main a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; text-decoration-thickness:1px; }
  main strong { font-weight:650; }
  main code { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.88em; background:var(--code-bg);
    padding:1px 5px; border-radius:5px; }
  main pre { background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto;
    font-size:14px; line-height:1.5; }
  main pre code { background:none; padding:0; font-size:inherit; }
  main blockquote { margin:14px 0; padding:8px 14px; border-left:3px solid var(--accent); background:var(--accent-soft);
    border-radius:0 8px 8px 0; color:var(--ink); }
  main blockquote p { margin:4px 0; }
  main hr { border:none; border-top:1px solid var(--line); margin:28px 0; }
  .tbl { overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  main table { border-collapse:collapse; width:100%; font-size:15px; }
  main th, main td { text-align:left; vertical-align:top; padding:8px 12px; border-bottom:1px solid var(--line); }
  main th { color:var(--muted); font-weight:600; background:var(--surface-2); }
  main tr:last-child td { border-bottom:none; }
  main details { margin:12px 0; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  main summary { cursor:pointer; color:var(--muted); }
  .msg { color:var(--muted); }
  footer { max-width:760px; margin:0 auto; padding:0 16px 40px; color:var(--faint); font-size:14px; }
  footer a { color:var(--muted); }
  @media (max-width:520px) {
    body { font-size:16px; }
    main { padding-top:16px; }
    main h1 { font-size:25px; }
    main h2 { font-size:19px; }
  }
</style>
</head>
<body>
<header class="bar">
  <a class="wordmark" href="/guide">Chronos <span>guide</span></a>
  <span class="sp"></span>
  <a href="/guide" id="lnk-index">All pages</a>
  <a href="/desk" id="lnk-desk" title="Back to the Desk">‹ Desk</a>
</header>
<main id="doc"><p class="msg">Loading…</p></main>
<footer id="foot" hidden><a href="/guide">All pages</a> · <a href="/desk">Back to the Desk</a></footer>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<!-- Pure helpers, no DOM: src/guide-routes.test.ts lifts this block out and runs it. -->
<script id="guide-lib">
const GUIDE_REPO = "https://github.com/leorfer23/getchronos/blob/main/";
/** "/guide" → "index", "/guide/jobs" → "jobs"; anything else (should not happen: the route 404s it) → null. */
function guideName(pathname) {
  if (pathname === "/guide.html") return "index"; // express.static serves the file under its own name too
  const m = /^\/guide\/?([a-z0-9-]*)\/?$/.exec(pathname || "");
  if (!m) return null;
  return m[1] || "index";
}
/**
 * Where a link in a guide page should go. The markdown links work on GitHub as written
 * (`jobs.md`, `README.md`, `../../HOSTS.md`); inside the daemon they become `/guide/jobs`,
 * `/guide`, and the repo file on GitHub. External and absolute links are left alone.
 */
function guideHref(href) {
  const h = String(href || "");
  if (!h || h.startsWith("#") || h.startsWith("/") || /^[a-z][a-z0-9+.-]*:/i.test(h)) return h;
  const m = /^(?:\.\/)?([A-Za-z0-9-]+)\.md(#.*)?$/.exec(h);
  if (m) {
    const frag = m[2] || "";
    if (m[1] === "README") return "/guide" + frag;
    if (/^[a-z0-9-]+$/.test(m[1])) return "/guide/" + m[1] + frag;
  }
  // Anything else relative is a repo file: resolve it against docs/guide/ and send it to GitHub.
  const parts = ["docs", "guide"];
  for (const seg of h.split("/")) {
    if (seg === "..") parts.pop();
    else if (seg && seg !== ".") parts.push(seg);
  }
  return GUIDE_REPO + parts.join("/");
}
</script>
<script>
(async function () {
  const doc = document.getElementById("doc");
  const name = guideName(location.pathname);
  const fail = (msg) => { doc.innerHTML = ""; const p = document.createElement("p"); p.className = "msg"; p.textContent = msg; doc.appendChild(p); };
  if (!name) return fail("No such guide page.");
  let text;
  try {
    const r = await fetch("/guide/" + name + ".md", { cache: "no-store" });
    if (!r.ok) return fail(r.status === 404 ? "No such guide page." : "Could not load this page (" + r.status + ").");
    text = await r.text();
  } catch (e) {
    return fail("Could not reach the daemon.");
  }
  if (!window.marked || !window.DOMPurify) return fail("The page renderer did not load.");
  doc.innerHTML = DOMPurify.sanitize(marked.parse(text));
  for (const a of doc.querySelectorAll("a[href]")) {
    const to = guideHref(a.getAttribute("href"));
    a.setAttribute("href", to);
    if (/^https?:/i.test(to)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
  }
  // Wide tables scroll inside their own box instead of the page at phone width.
  for (const t of doc.querySelectorAll("table")) {
    const w = document.createElement("div");
    w.className = "tbl";
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  }
  const h1 = doc.querySelector("h1");
  document.title = (h1 ? h1.textContent.trim() + " — " : "") + "Chronos guide";
  document.getElementById("foot").hidden = name === "index";
  if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
})();
</script>
</body>
</html>
