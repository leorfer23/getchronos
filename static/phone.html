<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#10140F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chronos">
<link rel="manifest" href="/phone.webmanifest">
<link rel="icon" href="/phone-icon.png">
<link rel="apple-touch-icon" href="/phone-icon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<title>Chronos</title>
<meta name="chronos-build" content="2026-09-11a">
<style>
  :root {
    --bg:#0C0F0B; --surface:#151A16; --surface-2:#1E2520; --raised:#262E28; --ink:#E9EFEA; --muted:#98A59D;
    --faint:#7C8880; --line:#273029; --accent:#56B693; --accent-ink:#0D1511; --accent-soft:#1C3A2E;
    --warn:#E0B44C; --warn-soft:#3A2F10; --danger:#E8705F; --danger-soft:#3D1F1A; --blue:#6FA8DC;
    --term-bg:#0C0F0B; --r:18px; --tap:52px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font:17px/1.4 -apple-system,system-ui,Roboto,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .mono { font-family:ui-monospace,"Roboto Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; }
  input,textarea,select { font:inherit; color:inherit; }
  [hidden] { display:none !important; }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  .view { flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ── home ─────────────────────────────────────────────────────────────────── */
  .home-scroll { flex:1; overflow-y:auto; padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 24px); -webkit-overflow-scrolling:touch; }
  .brand { display:flex; align-items:center; justify-content:space-between; margin:4px 0 14px; }
  .brand h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .brand .sub { color:var(--muted); font-size:15px; }
  .brand .tools { display:flex; align-items:center; gap:10px; }
  .brand .ic-sm { width:44px; height:44px; border-radius:50%; background:var(--surface); font-size:20px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .strip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:0 -16px 16px; padding:0 16px 2px; }
  .strip::-webkit-scrollbar { display:none; }
  .strip .chip { flex:none; height:42px; padding:0 14px; font-size:15px; }
  .strip .chip .c { display:inline-flex; gap:5px; align-items:center; font-size:13px; color:inherit; opacity:.85; }
  .strip .chip .c i { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .strip .chip.on .c i { box-shadow:0 0 0 1.5px var(--accent-ink); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.working { background:var(--accent); box-shadow:0 0 0 3px rgba(86,182,147,.18); animation:pulse 1.6s ease-in-out infinite; }
  .dot.waiting { background:var(--warn); }
  .dot.blocked { background:var(--danger); }
  .dot.done { background:var(--blue); }
  /* The seven phases (src/term-status.ts) — same colours as the Desk rail. */
  .dot.blocked { background:var(--danger); }
  .dot.decide { background:#B795F2; }
  .dot.review { background:var(--accent); animation:none; box-shadow:none; }
  .dot.your_turn { background:var(--warn); }
  .dot.stalled { background:var(--faint); box-shadow:0 0 0 2px var(--warn-soft); }
  .dot.waiting { background:transparent; box-shadow:inset 0 0 0 2px var(--blue); }
  .dot.working { background:#5CC3D8; box-shadow:0 0 0 3px rgba(92,195,216,.18); }
  .card .meta .ph { font-weight:700; letter-spacing:.03em; }
  .card .meta .ph.blocked { color:var(--danger); } .card .meta .ph.decide { color:#B795F2; }
  .card .meta .ph.review { color:var(--accent); } .card .meta .ph.your_turn { color:var(--warn); }
  .card .meta .ph.waiting { color:var(--blue); } .card .meta .ph.working { color:#5CC3D8; }
  .card.needs.decide { background:linear-gradient(135deg, var(--surface) 0%, #2C2340 140%); border-color:#4A3A6A; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(86,182,147,.08); } }

  .big { height:60px; border-radius:var(--r); font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px; }
  .big.primary { background:var(--accent); color:var(--accent-ink); }
  .big.secondary { background:var(--surface-2); color:var(--ink); }
  .big:active, .card:active, .chip:active, .qk:active, .row:active { transform:scale(.98); filter:brightness(1.12); }

  section.group { margin-bottom:22px; }
  .group h2 { margin:0 0 10px; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .group h2 .n { background:var(--surface-2); color:var(--ink); border-radius:999px; padding:1px 9px; font-size:12px; }
  .group h2 button { margin-left:auto; color:var(--accent); font-size:14px; font-weight:600; text-transform:none; letter-spacing:0; }
  .cards { display:flex; flex-direction:column; gap:10px; }
  .card { width:100%; text-align:left; background:var(--surface); border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; min-height:72px; }
  .card.needs { background:linear-gradient(135deg, var(--surface) 0%, var(--warn-soft) 140%); border:1px solid #4A3D18; }
  .card.needs.blocked { background:linear-gradient(135deg, var(--surface) 0%, var(--danger-soft) 140%); border-color:#5A2A22; }
  .card > span, .row > span { min-width:0; overflow-wrap:anywhere; }
  .card .title { font-size:17px; font-weight:700; line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .meta { color:var(--muted); font-size:14px; margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .card .prompt { margin-top:8px; color:var(--warn); font-size:15px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .card.blocked .prompt { color:var(--danger); }
  .card.decide .prompt { color:#B795F2; }
  .card .chev { color:var(--faint); font-size:22px; }
  .card .tag { color:var(--ws,var(--muted)); background:transparent; padding:0; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:800; }
  /* A Lead's workers, in the space their cards would have taken. */
  .card .wk { font-size:12px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .card .one { margin-top:6px; color:var(--muted); font-size:14.5px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card.fin { border:1px solid #2E5A47; }
  .card .answers button.go { background:var(--accent); color:var(--accent-ink); }
  .card .answers { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; grid-column:1 / -1; }
  .card .answers button { height:44px; padding:0 16px; border-radius:12px; background:var(--accent-soft); color:var(--accent); font-size:15.5px; font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .answers button.no { background:var(--danger-soft); color:var(--danger); }
  .card .answers button.more { background:var(--surface-2); color:var(--muted); }
  .card.needs { grid-template-rows:auto auto; }
  .card.ended { opacity:.75; }
  .tag { background:var(--surface-2); color:var(--muted); border-radius:6px; padding:1px 7px; font-size:12.5px; font-weight:600; }
  .empty { color:var(--faint); padding:18px 6px; text-align:center; font-size:15px; }

  .ptr { height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; transition:height .18s; }
  .ptr.on { height:44px; }
  /* The one bar: open work, or talk to Robert. Everything else is a tap into a card. */
  .hbar { display:flex; gap:10px; padding:10px 16px calc(var(--sab) + 12px); background:var(--surface); border-top:1px solid var(--line); }
  .hbar .big { flex:1; }

  /* ── motion ───────────────────────────────────────────────────────────────── */
  @keyframes in-right { from { transform:translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes in-left  { from { transform:translateX(-24px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes fade-in  { from { opacity:0; } to { opacity:1; } }
  .view.in-right { animation:in-right .2s ease-out; }
  .view.in-left  { animation:in-left .2s ease-out; }
  .view.fade     { animation:fade-in .18s ease-out; }
  @media (prefers-reduced-motion: reduce) { .view { animation:none !important; } }
  .skel { background:linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size:200% 100%; animation:shimmer 1.2s linear infinite; border-radius:var(--r); }
  @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .skel.card { height:74px; }
  .skel.row { height:58px; border-radius:14px; }

  /* ── terminal screen ──────────────────────────────────────────────────────── */
  .thead { padding:calc(var(--sat) + 8px) 8px 8px; display:grid; grid-template-columns:var(--tap) 1fr var(--tap); align-items:center; gap:4px; background:var(--surface); border-bottom:1px solid var(--line); }
  .thead .ic { width:var(--tap); height:var(--tap); display:flex; align-items:center; justify-content:center; font-size:26px; border-radius:14px; }
  .thead .tt { min-width:0; text-align:center; }
  .thead .tt b { display:block; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thead .tt small { display:flex; justify-content:center; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  .term-wrap { flex:1; min-height:0; position:relative; background:var(--term-bg); overflow:hidden; touch-action:none; }
  .term-host { position:absolute; inset:0; padding:6px 0 0 8px; }
  .term-host .xterm { pointer-events:none; }
  .term-host .xterm * { pointer-events:none; }
  .term-host .xterm-helper-textarea { pointer-events:none; opacity:0; width:0; height:0; }
  .term-host .xterm { height:100%; }
  .term-host .xterm-viewport { overflow-y:auto !important; }
  .term-off { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--muted); background:rgba(12,15,11,.85); text-align:center; padding:24px; }
  .banner { margin:0; padding:12px 16px; background:var(--warn-soft); color:var(--warn); font-size:15.5px; line-height:1.35; border-top:1px solid #4A3D18; max-height:34vh; overflow-y:auto; white-space:pre-wrap; }
  .banner.blocked { background:var(--danger-soft); color:var(--danger); border-color:#5A2A22; }
  .banner .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .banner .opts button { height:44px; padding:0 16px; border-radius:12px; background:rgba(0,0,0,.35); color:var(--ink); font-size:15.5px; font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .banner .opts button.no { color:var(--danger); }
  .banner .lbl { display:block; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.8; margin-bottom:3px; }
  .quick { display:flex; gap:8px; padding:10px 12px 4px; overflow-x:auto; scrollbar-width:none; background:var(--surface); }
  .quick::-webkit-scrollbar { display:none; }
  .qk { flex:none; height:44px; min-width:56px; padding:0 14px; border-radius:12px; background:var(--surface-2); font-size:16px; font-weight:700; }
  .qk.on { background:var(--accent); color:var(--accent-ink); }
  .qk.enter { background:var(--accent-soft); color:var(--accent); }
  .qk.qa { background:var(--bg); border:1px solid var(--line); font-weight:600; }
  .composer { display:flex; gap:8px; align-items:flex-end; padding:8px 12px calc(var(--sab) + 10px); background:var(--surface); }
  .composer textarea { flex:1; min-height:48px; max-height:140px; resize:none; border-radius:16px; border:1px solid var(--line); background:var(--bg); padding:12px 14px; font-size:17px; line-height:1.3; outline:none; }
  .composer textarea:focus { border-color:var(--accent); }
  .composer .mic { width:48px; height:48px; border-radius:50%; background:var(--surface-2); color:var(--ink); font-size:22px; display:flex; align-items:center; justify-content:center; flex:none; user-select:none; -webkit-user-select:none; }
  .composer .mic.rec { background:var(--danger); color:#fff; animation:recpulse 1s ease-in-out infinite; }
  .composer .mic.busy { background:var(--warn-soft); color:var(--warn); }
  @keyframes recpulse { 50% { box-shadow:0 0 0 10px rgba(232,112,95,.25); } }
  .mic { touch-action:none; }
  #recbar { position:fixed; left:8px; right:8px; bottom:calc(var(--sab) + 8px); z-index:80; display:flex; align-items:center; gap:12px; padding:10px; background:var(--raised); border:1px solid var(--line); border-radius:22px; box-shadow:0 -6px 28px rgba(0,0,0,.45); }
  #recbar button { height:58px; border-radius:18px; font-size:18px; font-weight:800; flex:none; }
  #rb-cancel { width:58px; background:var(--surface-2); color:var(--ink); font-size:22px; }
  #rb-go { padding:0 20px; min-width:118px; background:var(--accent); color:var(--accent-ink); }
  #recbar[data-state="failed"] #rb-go { background:var(--warn-soft); color:var(--warn); }
  .rb-mid { flex:1; min-width:0; display:flex; align-items:center; gap:10px; font-size:16.5px; font-weight:700; }
  .rb-mid #rb-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .rb-mid #rb-label:empty { display:none; }
  .rb-dot { width:12px; height:12px; border-radius:50%; background:var(--danger); flex:none; animation:recblink 1.2s ease-in-out infinite; }
  #recbar:not([data-state="rec"]) .rb-dot { background:var(--warn); }
  #recbar[data-state="failed"] .rb-dot { animation:none; }
  #rb-time { font-variant-numeric:tabular-nums; color:var(--muted); flex:none; }
  .rb-lvl { display:flex; align-items:center; gap:3px; height:30px; margin-left:auto; flex:none; }
  .rb-lvl i { width:4px; height:30px; border-radius:2px; background:var(--danger); transform:scaleY(.1); transition:transform .09s linear; }
  #recbar:not([data-state="rec"]) .rb-lvl { display:none; }
  @keyframes recblink { 50% { opacity:.3; } }
  .composer { position:relative; }
  .composer .send { width:48px; height:48px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:22px; display:flex; align-items:center; justify-content:center; flex:none; }
  .composer .send:disabled { opacity:.35; }
  .swipe-hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.6); color:var(--muted); font-size:12.5px; padding:4px 10px; border-radius:999px; pointer-events:none; opacity:0; transition:opacity .3s; }
  .swipe-hint.show { opacity:1; }

  /* ── focus screen ─────────────────────────────────────────────────────────── */
  .fhead { grid-template-columns:var(--tap) 1fr var(--tap) var(--tap); }
  .fstrips { background:var(--surface); border-bottom:1px solid var(--line); }
  .fstrips .strip { margin:0; padding:8px 12px 10px; }
  .fstrips .strip .chip.cl { height:40px; font-size:14px; padding:0 12px; background:var(--accent-soft); color:var(--accent); }
  .tchip { flex:none; height:40px; padding:0 12px; border-radius:12px; background:var(--surface-2); font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:7px; max-width:230px; }
  .tchip span.l { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tchip.on { background:var(--raised); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .tchip.dim { opacity:.6; }
  .tchip .dot { width:8px; height:8px; }
  .vchips { display:flex; gap:8px; flex-wrap:wrap; margin:-6px 0 14px; }
  .vchip { display:inline-flex; align-items:center; gap:4px; height:34px; padding:0 12px; border-radius:10px; background:var(--surface-2); color:var(--accent); font-size:14px; font-weight:700; text-decoration:none; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vchip.diff { color:var(--muted); font-family:ui-monospace,"Roboto Mono",Menlo,monospace; }
  .vchip.diff b { color:var(--accent); font-weight:700; } .vchip.diff i { color:var(--danger); font-style:normal; }
  .fscroll { flex:1; min-height:0; overflow-y:auto; padding:14px 16px 24px; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  .fstatus { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; margin-bottom:14px; min-width:0; }
  .fstatus .st { flex:none; }
  .fstatus .st { display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:17px; }
  .fstatus .bits { color:var(--muted); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .fblock { background:var(--surface); border-radius:var(--r); padding:14px 16px; margin-bottom:12px; }
  .fblock .lbl { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:700; }
  .fblock .lbl button { color:var(--accent); font-size:13px; text-transform:none; letter-spacing:0; font-weight:700; min-height:28px; }
  .fblock .t { font-size:16.5px; line-height:1.4; overflow-wrap:anywhere; }
  .fblock .t p { margin:0 0 8px; } .fblock .t p:last-child { margin:0; }
  .fblock .t ul, .fblock .t ol { margin:0 0 8px; padding-left:22px; }
  .fblock .t a { color:var(--accent); }
  .fblock .t code { font-family:ui-monospace,"Roboto Mono",Menlo,monospace; font-size:14px; }
  .fblock .t pre { background:var(--bg); padding:10px; border-radius:10px; overflow-x:auto; font-size:13px; }
  .fblock.goal .t { font-weight:700; font-size:18px; }
  .fblock.goal .sub { color:var(--muted); font-size:14px; margin-top:8px; }
  .fblock .t table { display:block; overflow-x:auto; white-space:nowrap; font-size:13.5px; border-collapse:collapse; max-width:100%; }
  .fblock .t th, .fblock .t td { padding:3px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .fblock .t img { max-width:100%; }
  .fblock.clamp .t { max-height:17em; overflow:hidden; }
  .fblock.clamp.over .t { -webkit-mask-image:linear-gradient(#000 82%, transparent); mask-image:linear-gradient(#000 82%, transparent); }
  .fblock .t h1, .fblock .t h2, .fblock .t h3, .fblock .t h4, .fl.say h1, .fl.say h2, .fl.say h3, .fl.say h4 { font-size:1em; font-weight:800; margin:0 0 6px; }
  .fl a, .fblock .t a { color:var(--accent); overflow-wrap:anywhere; }
  .fblock.clamp.und .t { max-height:8em; }
  .fblock.clamp.open .t { max-height:none; -webkit-mask-image:none; mask-image:none; }
  .fblock.latest { border:1px solid #2E5A47; }
  .fblock.prev { opacity:.8; } .fblock.prev .t { color:var(--muted); }
  .fblock.result { border:1px solid #2E5A47; background:linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 160%); }
  .fblock.fatt { background:linear-gradient(135deg, var(--surface) 0%, var(--warn-soft) 140%); border:1px solid #4A3D18; }
  .fblock.fatt .lbl { color:var(--warn); }
  .fblock.fatt.blocked { background:linear-gradient(135deg, var(--surface) 0%, var(--danger-soft) 140%); border-color:#5A2A22; }
  .fblock.fatt.blocked .lbl { color:var(--danger); }
  .fatt .q { font-size:17px; line-height:1.35; white-space:pre-wrap; overflow-wrap:anywhere; }
  .fatt .opts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .fatt .opts button { min-height:46px; padding:8px 16px; border-radius:12px; background:rgba(0,0,0,.35); color:var(--ink); font-size:15.5px; font-weight:700; text-align:left; max-width:100%; overflow-wrap:anywhere; }
  .fatt .opts button.no { color:var(--danger); }
  .fatt .opts button.go { background:var(--accent); color:var(--accent-ink); }
  .fl { padding:7px 0; border-bottom:1px solid var(--line); font-size:15px; line-height:1.4; overflow-wrap:anywhere; }
  .fl:last-child { border-bottom:0; }
  .fl.act { color:var(--muted); opacity:.8; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fl.acts { color:var(--faint); font-size:13px; }
  .fl.you { color:var(--accent); }
  .fl.err { color:var(--danger); font-size:13.5px; }
  .fl.link a { color:var(--accent); font-weight:600; overflow-wrap:anywhere; }
  .fl.you::before { content:"you · "; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .fl.say p { margin:0 0 6px; } .fl.say p:last-child { margin:0; }
  .fl.say ul, .fl.say ol { margin:0 0 6px; padding-left:20px; }

<script>
// Chronos on a phone. A dashboard first (what needs me, what is working, my notes), one fullscreen
// terminal when you tap in, and a chat-style composer because typing raw keystrokes into xterm on a
// phone keyboard is how you lose an afternoon. Same daemon, same API, same admin token as /desk —
// same origin, so a token pasted once into the Desk works here too.
const qs = (s, r = document) => r.querySelector(s);
const qsa = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WS_SCHEME = location.protocol === "https:" ? "wss:" : "ws:";
let TOKEN = localStorage.getItem("mc-token") || null;
// A flaky tunnel throws a network-level TypeError ("Failed to fetch" / "Load failed") before any
// response arrives — cloudflared usually fails over inside a couple seconds. One retry on a GET
// rides that out instead of surfacing it as an error; a write is never silently resent.
const api = (p, opts) => {
  const method = (opts?.method || "GET").toUpperCase();
  const send = () => fetch("/api" + p, {
    ...opts,
    headers: { "content-type": "application/json", ...(TOKEN ? { "x-mc-admin": TOKEN } : {}), ...(opts?.headers || {}) },
  });
  return send()
    .catch((err) => (method === "GET" && err instanceof TypeError ? new Promise((r) => setTimeout(r, 1200)).then(send) : Promise.reject(err)))
    .then(async (r) => { if (!r.ok) throw Object.assign(new Error((await r.text()).slice(0, 200)), { status: r.status }); return r.status === 204 ? null : r.json(); });
};

let toastT;
function toast(msg, act) {
  const t = qs("#toast"); t.textContent = msg;
  if (act?.fn) { const b = document.createElement("button"); b.textContent = act.label || "Undo"; b.onclick = () => { fx.tap(); t.classList.remove("show"); act.fn(); }; t.appendChild(b); }
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), act ? 5000 : 2400);
}
// Feedback you can feel. Every tone is synthesized on the spot (no files to load through the
// tunnel), every pattern is short, and both stay off until the first touch — Android only lets a
// page vibrate or make sound after a user gesture, and the AudioContext has to be unlocked by one.
const fx = (() => {
  let ctx = null, on = localStorage.getItem("phone-fx") !== "off";
  const unlock = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ctx?.state === "suspended") ctx.resume().catch(() => {}); };
  document.addEventListener("pointerdown", unlock, { capture: true, passive: true });
  document.addEventListener("touchstart", unlock, { capture: true, passive: true });
  const buzz = (p) => { if (on) try { navigator.vibrate?.(p); } catch {} };
  // A note: frequency, length, shape, volume — tiny envelope so nothing clicks or drones.
  const tone = (f, ms, type = "sine", gain = 0.12, at = 0, slideTo = null) => {
    if (!on || !ctx) return;
    const t0 = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + ms / 1000);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms / 1000);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + ms / 1000 + 0.02);
  };
  return {
    get on() { return on; },
    toggle() { on = !on; localStorage.setItem("phone-fx", on ? "on" : "off"); if (on) { unlock(); this.tap(); } return on; },
    tap()     { buzz(6);  tone(1400, 28, "square", 0.05); },                    // a card, a chip, a key
    tick()    { buzz(12); tone(900, 40, "triangle", 0.09); },                    // crossed the swipe line
    success() { buzz([12, 40, 18]); tone(660, 90, "sine", 0.12); tone(990, 140, "sine", 0.12, 0.08); }, // done, opened, saved
    warn()    { buzz([30, 30, 30]); tone(220, 160, "sawtooth", 0.07, 0, 140); }, // delete, kill
    send()    { buzz(10); tone(520, 70, "sine", 0.1, 0, 1040); },               // message away
    recOn()   { buzz([15, 40, 25]); tone(440, 80, "sine", 0.1); tone(660, 110, "sine", 0.1, 0.09); },
    recOff()  { buzz(15); tone(660, 70, "sine", 0.09); tone(440, 110, "sine", 0.09, 0.08); },
    ready()   { buzz(8); tone(1200, 60, "triangle", 0.08); },                    // transcript landed
    reply()   { buzz([10, 60, 10]); tone(880, 80, "sine", 0.09); tone(1320, 160, "sine", 0.09, 0.09); }, // Robert answered

// Every sheet closes three ways: tap the dim backdrop, tap ✕, or drag it down — from the handle, or
// from anywhere in it once its content is scrolled to the top. The sheet follows the finger, and

function sheet(html) {

  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><div class="grab-zone"><div class="grab"></div></div><button class="x" data-x aria-label="Close">✕</button>${html}</div>`;
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-x]")) { fx.tap(); closeSheet(); } });

      const pages = Math.trunc(pageAcc / Math.max(1, term.rows - 2));
      if (pages) { pageAcc -= pages * (term.rows - 2); if (sock?.readyState === 1) sock.send(JSON.stringify({ t: "in", d: (pages > 0 ? "\x1b[5~" : "\x1b[6~").repeat(Math.min(Math.abs(pages), 3)) })); }
      return;
    }
    term.scrollLines(-rows);
  };
  let pageAcc = 0;
  // xterm's pointer events are off here (a tap must never pull the keyboard up), so the browser's own
  // long-press selection never fires. A held finger that does not move opens the screen as plain
  // selectable text instead (copySheet), with the whole thing one tap away.
  let lp = 0, lpFired = false;
  const lpClear = () => { if (lp) { clearTimeout(lp); lp = 0; } };
  wrap.addEventListener("touchstart", (e) => {
    stop(e); cancelAnimationFrame(inertia); lastTouch = Date.now();
    const t = e.touches[0]; x0 = fx0 = t.clientX; y0 = ly = fy0 = t.clientY; t0 = lt = Date.now(); acc = 0; pageAcc = 0; axis = null; vel = 0;
    lpFired = false; lpClear();
    if (e.touches.length === 1) lp = setTimeout(() => { lp = 0; lpFired = true; fx.tap(); copySheet(); }, 550);
  }, { capture: true, passive: false });
  wrap.addEventListener("touchmove", (e) => {
    stop(e);
    const t = e.touches[0]; const mx = t.clientX - x0, my = t.clientY - y0;
    if (axis === null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) axis = Math.abs(my) >= Math.abs(mx) ? "y" : "x";
    if (axis !== null) lpClear();
    if (axis !== "y") return;
    const now = Date.now(), dy = t.clientY - ly;
    lastTouch = now; fx0 = t.clientX; fy0 = t.clientY;
    if (now > lt) vel = dy / (now - lt);
    ly = t.clientY; lt = now;
    scrollBy(dy);
  }, { capture: true, passive: false });
  wrap.addEventListener("touchend", (e) => {
    stop(e); lastTouch = Date.now(); lpClear();
    if (lpFired) { lpFired = false; return; }
    if (axis === "y") {
      // A flick keeps going: same feel as any list on the phone.
      let v = vel * 16, last = performance.now();
      const step = (now) => { const dt = now - last; last = now; v *= Math.pow(0.94, dt / 16); if (Math.abs(v) < 0.3) return; scrollBy(v); inertia = requestAnimationFrame(step); };
      if (Math.abs(v) > 2) inertia = requestAnimationFrame(step);
      return;
    }
    const t = e.changedTouches[0]; const dx = t.clientX - x0, dy = t.clientY - y0;
    if (axis !== "x" || Date.now() - t0 > 600 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
    const order = S.sessions.filter((s) => s.live).sort((a, b) => (ORDER[a.state] ?? 9) - (ORDER[b.state] ?? 9));
    const i = order.findIndex((s) => s.id === S.current);
    const next = order[i + (dx < 0 ? 1 : -1)];
    if (!next) { fx.fail(); hint(dx < 0 ? "last terminal" : "first terminal"); return; }
    fx.tick(); hint(`${i + (dx < 0 ? 2 : 0)} / ${order.length}`); openTerm(next.id);
  }, { capture: true, passive: false });
  wrap.addEventListener("touchcancel", (e) => { stop(e); lpClear(); }, { capture: true, passive: false });
  // A synthetic click after a tap still reaches the element; keep it from focusing anything.
  wrap.addEventListener("mousedown", (e) => { e.preventDefault(); }, { capture: true });
  wrap.addEventListener("focusin", (e) => { if (e.target !== wrap) { e.target.blur?.(); } }, { capture: true });
  let hT; function hint(t) { const h = qs("#swipe-hint"); h.textContent = t; h.classList.add("show"); clearTimeout(hT); hT = setTimeout(() => h.classList.remove("show"), 900); }
})();

// The terminal's text as text: every line xterm holds for this session (scrollback included on the
// normal screen; just the visible rows on a TUI's alternate screen), blank runs collapsed.
function screenText() {
  if (!term) return "";
  const b = term.buffer.active, out = [];
  for (let i = 0; i < b.length; i++) { const l = b.getLine(i); if (l) out.push(l.translateToString(true)); }
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch { return false; }
}
function copySheet() {
  const text = screenText();
  if (!text) return toast("nothing on screen yet");
  const b = sheet(`<h3>Copy</h3>
    <div class="btns"><button class="big primary wide" id="cp-all">Copy all</button></div>
    <pre class="copytext" id="cp-text"></pre>`);
  qs("#cp-text", b).textContent = text;
  qs("#cp-all", b).onclick = async () => { fx.tap(); if (await copyText(text)) { fx.success(); toast("copied"); closeSheet(); } else { fx.fail(); toast("couldn't copy — select the text instead"); } };
}

// Keyboard up/down changes the visible area: refit so the pty's rows match what you can see.
(window.visualViewport || window).addEventListener("resize", () => { clearTimeout(window.__rf); window.__rf = setTimeout(() => refit(true), 80); });
window.addEventListener("orientationchange", () => setTimeout(() => refit(true), 300));

// ── live updates ────────────────────────────────────────────────────────────
const BUS_TOPICS = ["session.status", "session.activity", "agent.state", "session.started", "session.ended", "session.updated", "session.usage", "agent.delta", "agent.push", "ask.created", "ask.answered", "focus.event"].join(",");
let busRetry = 1000, reloadT;
const reloadSoon = () => { clearTimeout(reloadT); reloadT = setTimeout(() => load().catch(() => {}), 250); };
function connectBus() {
  if (!TOKEN) return;
  const ws = new WebSocket(`${WS_SCHEME}//${location.host}/ws?token=${encodeURIComponent(TOKEN)}&topics=${encodeURIComponent(BUS_TOPICS)}`);
  ws.onopen = () => {
    busRetry = 1000; qs("#bus-dot").className = "dot working";
    // A turn whose request dropped may have finished while the bus was down too: reread the thread.
    if (R.lost) { R.lost = false; R.loaded = false; R.mine = null; R.pend.clear(); robertHistory(); }
  };
  ws.onclose = () => { qs("#bus-dot").className = "dot"; setTimeout(connectBus, busRetry); busRetry = Math.min(busRetry * 2, 20000); };
  ws.onmessage = (ev) => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    AskCard.onEvent(e);
    if (AskCard.TOPICS.includes(e.topic)) return;
    if (e.topic === "agent.delta") {
      // Only his words: thinking and tool lines are not the answer.
      const mine = e.client === CLIENT;
      if (!e.text || (e.kind && e.kind !== "text") || !(mine || ourThread(e.ws))) return;
      const key = e.turn || "?";
      let b = R.pend.get(key);
      if (!b) { b = mine && R.mine ? R.mine : bubble("rob pending", ""); if (mine) R.mine = null; R.pend.set(key, b); }
      b._raw = (b._raw || "") + e.text; b.innerHTML = mdRob(b._raw);
      qs("#chat").scrollTop = qs("#chat").scrollHeight; return;
    }
    if (e.topic === "agent.push") {
      const mine = e.client === CLIENT;
      if (e.source === "divider" || !(mine || ourThread(e.ws))) return;
      if (e.turn && R.seen.has(e.turn)) return;
      if (e.turn) R.seen.add(e.turn);
      const b = R.pend.get(e.turn || "?"); if (b) { b.remove(); R.pend.delete(e.turn || "?"); }
      if (mine) { dropMine(); R.lost = false; if (e.you && !R.mineYou?.isConnected) RP.quote(RP.mark(bubble("you", e.you), e.id, "you"), e.quote); }
      else if (e.you) RP.quote(RP.mark(bubble("you", e.you), e.id, "you"), e.quote); // said on the Desk (or another phone)
      if (e.reply) { fx.reply(); RP.mark(bubble("rob", e.reply), e.id, "reply"); }
      return;
    }
    if (e.topic === "focus.event") {
      if (e.session_id !== F.id || !isFocusUp()) return;
      const ev = e.event; if (!ev || typeof ev.seq !== "number" || F.seen.has(ev.seq)) return;
      F.seen.add(ev.seq); F.events.push(ev);
      if (F.loaded) { F.events.sort((a, b) => a.seq - b.seq); renderFocusSoon(); }
      return;
    }
    if (e.topic === "session.usage") {
      const s = byId(e.session_id); if (!s) return;
      s.usage = e.usage || s.usage;
      if (S.current === s.id && isFocusUp()) renderFocusSoon();
      return;
    }
    if (e.topic === "session.status") {
      const s = byId(e.session_id); if (!s || !e.status) return;
      const was = s.status?.phase;
      s.status = e.status;
      if (was !== e.status.phase && ["blocked", "decide", "your_turn"].includes(e.status.phase)) fx.needsYou();
      badge(needsCount());
      if (S.current === s.id) renderCurrent(); else renderHome();
      return;
    }
    if (e.topic === "session.activity") {
      const s = byId(e.session_id); if (!s || s.state === "done" || s.state === "blocked") return;
      const was = s.state;
      s.state = e.state === "working" ? "working" : "waiting";
      s.prompt = e.state === "working" ? null : (e.prompt ?? s.prompt ?? null);
      if (was === "working" && s.state === "waiting" && !s.status) fx.needsYou();
      badge(needsCount());
      if (S.current === s.id) renderCurrent(); else renderHome();
      return;
    }
    if (e.topic === "agent.state" && e.kind === "session") {
      const s = byId(e.id); if (!s || s.state === "done") return;
      const was = s.state;
      s.state = e.state === "blocked" ? "blocked" : e.state === "working" ? "working" : "waiting";
      if (was !== "blocked" && s.state === "blocked" && !s.status) fx.needsYou();
      s.blocked_reason = e.blocked_reason ?? null; s.state_label = e.state_label ?? s.state_label;
      if (S.current === s.id) renderCurrent(); else renderHome();
      return;
    }

}
// Back from the background: the socket may have died. Reset the screen before reattaching, or the
// server's scrollback replay lands on top of what is already there.
// Coming back: refresh the list, and if a terminal is up, reset the screen and reattach so the
// replay lands on a clean frame (not on top of a stale one), then refit for whatever the viewport
// is now. pageshow covers the app switcher / bfcache path where visibilitychange does not fire.
function resume() {
  if (document.hidden) return;
  reloadSoon();
  if (S.current && isFocusUp()) { const id = S.current; api("/sessions/" + id + "/focus").then((r) => { if (F.id !== id) return; for (const ev of r.events || []) if (ev && !F.seen.has(ev.seq)) { F.seen.add(ev.seq); F.events.push(ev); } F.events.sort((a, b) => a.seq - b.seq); F.loaded = true; renderFocus(); }).catch(() => {}); }
  else if (S.current) { const id = S.current; term?.reset(); attach(id); setTimeout(() => { if (S.current === id) refit(true); }, 350); }
  else if (typeof connectBus === "function" && qs("#bus-dot").className === "dot") connectBus();
}
document.addEventListener("visibilitychange", resume);
window.addEventListener("pageshow", (e) => { if (e.persisted) resume(); });
window.addEventListener("online", resume);

// ── push, badge, service worker ─────────────────────────────────────────────
// The worker (static/sw.js) shows the notification and can answer a prompt from its buttons; it
// needs the admin token for that, handed over here and kept in the worker's own IndexedDB.
const PUSH = (() => {
  let reg = null;
  const ready = async () => {
    if (!("serviceWorker" in navigator)) return null;
    if (!reg) { reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => null); }
    if (reg) { const w = reg.active || reg.waiting || reg.installing; w?.postMessage({ type: "token", token: TOKEN }); navigator.serviceWorker.controller?.postMessage({ type: "token", token: TOKEN }); }
    return reg;
  };
  const b64 = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };
  return {
    ready,
    async status() {
      if (!("Notification" in window) || !("PushManager" in window)) return { on: false, reason: "this browser can't do push" };
      if (!window.isSecureContext) return { on: false, reason: "needs HTTPS" };
      if (Notification.permission === "denied") return { on: false, reason: "blocked in browser settings" };
      const r = await ready(); if (!r) return { on: false, reason: "no service worker" };
      const sub = await r.pushManager.getSubscription();
      return { on: !!sub && Notification.permission === "granted", reason: "" };
    },
    async toggle() {
      const r = await ready(); if (!r) throw new Error("no service worker");
      const cur = await r.pushManager.getSubscription();
      if (cur) { await api("/push/subscribe", { method: "DELETE", body: JSON.stringify({ endpoint: cur.endpoint }) }).catch(() => {}); await cur.unsubscribe(); toast("notifications off"); return false; }
      const perm = await Notification.requestPermission();
      if (perm !== "granted") throw new Error("permission not granted");
      const { publicKey, enabled } = await api("/push/vapid");
      if (enabled === false) throw new Error("push is off on the daemon (CHRONOS_PUSH=0)");
      const sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
      await api("/push/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) });
      fx.success(); toast("notifications on");
      return true;
    },
  };
})();
// App-icon badge: how many terminals want you. Cleared as soon as nothing does.
function badge(n) { try { if (n > 0) navigator.setAppBadge?.(n); else navigator.clearAppBadge?.(); } catch {} }
// A notification tap lands on a hash: #s=<session> opens that terminal, #robert[=ws] his thread.
function handleHash() {
  const h = location.hash.slice(1); if (!h) return;
  history.replaceState(null, "", location.pathname);
  const go = () => {
    if (h.startsWith("s=")) { const id = h.slice(2); if (byId(id)) openFocus(id); else toast("that terminal is gone"); }
    else if (h.startsWith("robert")) { R.loaded = false; showRobert(); } // the filter is yours: a notification never moves it
  };
  if (S.loaded) go(); else document.addEventListener("phone:loaded", go, { once: true });
}
window.addEventListener("hashchange", handleHash);

// ── token ───────────────────────────────────────────────────────────────────
function tokenSheet() {
  const b = sheet(`<h3>Admin token</h3><p style="color:var(--muted);margin:0 0 14px">From <span class="mono">~/chronos/.admin-token</span> on the Mac. Stored only in this browser.</p>
    <div class="field"><input id="tok" placeholder="paste token" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="btns"><button class="big primary wide" id="tok-ok">Connect</button></div>`);
  qs("#tok-ok", b).onclick = () => { const t = qs("#tok", b).value.trim(); if (!t) return; localStorage.setItem("mc-token", t); TOKEN = t; location.reload(); };
}
if (!TOKEN) { qs("#brand-sub").textContent = "no token"; tokenSheet(); }
else {
  // A reload while a screen or sheet was up leaves its history entry behind; start clean.
  if (history.state?.view || history.state?.sheet) history.replaceState(null, "", location.pathname);
  PUSH.ready();
  handleHash();
  load().then(connectBus).catch((err) => {
    qs("#brand-sub").textContent = "can't reach the daemon";
    if (/401|403/.test(err.message)) { localStorage.removeItem("mc-token"); tokenSheet(); } else toast(err.message);
  });
}
</script>
