<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/pair.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0C0F0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robert" data-an="content">
<link rel="manifest" href="/phone.webmanifest">
<link rel="icon" href="/phone-icon.png">
<link rel="apple-touch-icon" href="/phone-icon-512.png">
<title data-an="text">Robert</title>
<meta name="chronos-build" content="2026-11-13a">
<style>
  :root {
    --bg:#0C0F0B; --surface:#151A16; --surface-2:#1E2520; --raised:#262E28; --ink:#E9EFEA; --muted:#98A59D;
    --faint:#7C8880; --line:#273029; --accent:#56B693; --accent-ink:#0D1511; --accent-soft:#1C3A2E;
    --warn:#E0B44C; --warn-soft:#3A2F10; --danger:#E8705F; --danger-soft:#3D1F1A; --blue:#6FA8DC; --blue-soft:#18283A;
    --decide:#B795F2; --term-bg:#0C0F0B; --r:18px; --tap:52px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  /* The keyboard is up: it covers the home indicator, so the bottom inset would be a gap above it. */
  body.kb { --sab:0px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font:17px/1.4 -apple-system,system-ui,Roboto,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .mono { font-family:ui-monospace,"Roboto Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.38; cursor:default; }
  input,textarea,select { font:inherit; color:inherit; }
  [hidden] { display:none !important; }
  svg { display:block; }

  #app { position:fixed; left:0; right:0; top:0; height:100%; display:flex; flex-direction:column; padding-left:var(--sal); padding-right:var(--sar); }
  .view { flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ── home: the conversation ───────────────────────────────────────────────── */
  .top { flex:none; display:flex; align-items:center; gap:8px; padding:calc(var(--sat) + 6px) 8px 6px 18px; }
  .top .who { flex:1; min-width:0; }
  .top .who b { display:block; font-size:21px; font-weight:800; letter-spacing:-.01em; }
  .top .who small { display:block; color:var(--muted); font-size:13px; min-height:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top .who small.warn { color:var(--warn); }
  .ic { width:var(--tap); height:var(--tap); display:flex; align-items:center; justify-content:center; border-radius:14px; color:var(--muted); flex:none; }
  .ic:active { background:var(--surface); }
  .deskb { height:34px; padding:0 12px; border-radius:999px; background:var(--surface); color:var(--muted); font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
  .deskb kbd { font:inherit; font-size:12px; font-weight:700; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:0 5px; }
  .locked { margin:auto; max-width:420px; padding:24px; text-align:center; color:var(--muted); line-height:1.5; }
  .locked b { display:block; color:var(--ink); font-size:20px; margin-bottom:6px; }
  .locked button { margin-top:18px; height:44px; padding:0 20px; border-radius:999px; background:var(--surface-2); color:var(--ink); font-weight:700; }
  .upd { height:34px; padding:0 14px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:14px; font-weight:700; }

  /* What is waiting for him: one compact entry, the next decision on it. */
  .qentry { flex:none; margin:2px 12px 6px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; text-align:left;
    padding:12px 14px; border-radius:18px; background:linear-gradient(135deg, var(--surface) 0%, var(--warn-soft) 170%); border:1px solid #4A3D18; }
  .qentry:active { filter:brightness(1.12); }
  .qentry .n { width:34px; height:34px; border-radius:50%; background:var(--warn); color:var(--bg); font-weight:800; font-size:16px; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
  .qentry .tx { min-width:0; }
  .qentry .tx b { display:block; font-size:16px; }
  .qentry .tx span { display:block; color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qentry .chev { color:var(--faint); }

  /* This phone cannot be reached when something gets stuck: one clear step to fix that, every launch. */
  .nrow { flex:none; margin:2px 12px 6px; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:linear-gradient(135deg, var(--surface) 0%, var(--blue-soft) 170%); border:1px solid #23405F; }
  .nrow .ni { width:34px; height:34px; border-radius:50%; background:var(--blue); color:var(--bg); display:flex; align-items:center; justify-content:center; flex:none; }
  .nrow .tx { flex:1; min-width:0; }
  .nrow .tx b { display:block; font-size:16px; }
  .nrow .tx span { display:block; color:var(--muted); font-size:14px; line-height:1.35; }
  .nrow .go { flex:none; height:40px; padding:0 16px; border-radius:999px; background:var(--blue); color:var(--bg); font-weight:800; font-size:15px; }
  .nrow .no { flex:none; width:32px; height:40px; color:var(--faint); font-size:18px; }
  .chat { flex:1; min-height:0; overflow-y:auto; padding:10px 14px 12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .chat .hello { margin:auto; text-align:center; color:var(--faint); font-size:16px; line-height:1.5; padding:24px; }
  .chat .hello b { display:block; color:var(--muted); font-size:18px; margin-bottom:4px; }
  /* flex-shrink:0 — a folded bubble (overflow:hidden) has no minimum height, so in this flex column it was squeezed to half a line once the log outgrew the screen. */
  .bub { flex-shrink:0; max-width:86%; padding:11px 15px; border-radius:20px; font-size:16.5px; line-height:1.42; white-space:pre-wrap; overflow-wrap:anywhere; }
  .bub.you { align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:6px; }
  .bub.rob { align-self:flex-start; background:var(--surface-2); border-bottom-left-radius:6px; white-space:normal; }
  .bub.rob a { color:var(--accent); overflow-wrap:anywhere; }
  .bub.rob p { margin:0 0 8px; } .bub.rob p:last-child { margin:0; }
  .bub.rob pre { background:var(--bg); padding:10px; border-radius:10px; overflow-x:auto; font-size:13.5px; }
  .bub.rob code { font-family:ui-monospace,"Roboto Mono",Menlo,monospace; font-size:14.5px; }
  .bub.rob ul, .bub.rob ol { margin:0 0 8px; padding-left:22px; }
  .bub.rob h1, .bub.rob h2, .bub.rob h3, .bub.rob h4 { font-size:1em; margin:0 0 6px; }
  /* A terminal he names is a chip: tap opens it. */
  .bub.rob a[href^="#sel="] { display:inline-flex; align-items:center; gap:4px; max-width:240px; padding:0 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:14px; font-weight:700; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; vertical-align:-4px; line-height:26px; }
  .bub.you.queued { opacity:.55; }
  .bub.you .unsent { display:block; margin-top:6px; font-size:13px; font-weight:700; text-decoration:underline; }
  .bub.pending { color:var(--muted); min-width:58px; }
  .bub.pending:empty::after { content:""; display:inline-block; width:34px; height:10px; background:radial-gradient(circle, var(--muted) 45%, transparent 50%) 0 50%/11px 10px repeat-x; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { width:0; } 100% { width:34px; } }
  @media (prefers-reduced-motion: reduce) { .bub.pending:empty::after { animation:none; width:34px; } }
  .bub.long:not(.open) { max-height:15.5em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 78%, transparent); mask-image:linear-gradient(#000 78%, transparent); }
  .chat .more-line { align-self:flex-start; margin:-6px 0 0 6px; color:var(--accent); font-size:14px; font-weight:700; padding:4px 8px; }
  .chat .day { align-self:center; color:var(--faint); font-size:12.5px; }
  .pick { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .pick button { height:40px; padding:0 14px; border-radius:999px; background:var(--surface); display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:700; }
  .pick button i { width:9px; height:9px; border-radius:50%; background:var(--c); }
  /* The Ask widget (static/ask-card.js), when Robert hands a question into the thread. */
  .bub.ak-only { padding:0; background:transparent; width:88%; }
  .askc { border-left:3px solid var(--warn); border-radius:14px; background:var(--surface); padding:12px 14px; white-space:normal; font-size:16px; line-height:1.4; }
  .askc.sending { opacity:.55; pointer-events:none; }
  .ak-h { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--muted); }
  .ak-i { width:20px; height:20px; flex:none; border-radius:50%; background:var(--warn); color:var(--bg); font-size:13px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
  .ak-who { flex:1; min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ak-age { flex:none; color:var(--faint); }
  .ak-q { margin-top:6px; font-size:17px; font-weight:700; overflow-wrap:anywhere; }
  .ak-note { margin-top:6px; font-size:14.5px; color:var(--muted); }
  .ak-ops { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .ak-ops button { min-height:44px; max-width:100%; padding:0 16px; border-radius:999px; background:var(--surface-2); font-size:15.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ak-f { display:flex; gap:8px; margin-top:10px; }
  .ak-f input { flex:1; min-width:0; min-height:44px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-size:16px; outline:none; }
  .ak-f button { flex:none; min-height:44px; padding:0 16px; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15.5px; font-weight:700; }
  .askc.done { display:flex; align-items:baseline; gap:8px; padding:9px 14px; border-left-color:var(--accent); font-size:15px; color:var(--muted); }
  .askc.done.gone { border-left-color:var(--faint); }
  .askc.done .ak-ok { color:var(--accent); font-weight:800; flex:none; }
  .askc.done .ak-q1 { flex:1 1 55%; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .askc.done .ak-a { flex:0 1 auto; min-width:0; max-width:45%; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── the dock: the call (when it is on) over the composer + the talk button ── */
  .dock { flex:none; background:var(--bg); padding:0 0 calc(var(--sab) + 10px); }
  .call { display:flex; flex-direction:column; align-items:center; padding:14px 18px 6px; position:relative; }
  .orb { width:112px; height:112px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; --lvl:0; }
  .orb::before { content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--oc) 70%, white) 0%, var(--oc) 46%, color-mix(in srgb, var(--oc) 55%, var(--bg)) 100%);
    transform:scale(calc(.72 + var(--lvl) * .28)); transition:transform .09s linear; box-shadow:0 0 0 calc(var(--lvl) * 16px) color-mix(in srgb, var(--oc) 22%, transparent); }
  .orb { --oc:var(--accent); }
  .call[data-state="connecting"] .orb, .call[data-state="paused"] .orb { --oc:#56625A; }
  .call[data-state="speaking"] .orb { --oc:var(--blue); }
  .call[data-state="thinking"] .orb, .call[data-state="transcribing"] .orb { --oc:var(--decide); }
  .call[data-state="listening"] .orb::before { animation:breathe 2.6s ease-in-out infinite; }
  .call[data-state="speaking"] .orb::before { animation:talk .5s ease-in-out infinite alternate; }
  .call[data-state="thinking"] .orb::after, .call[data-state="transcribing"] .orb::after, .call[data-state="connecting"] .orb::after { content:""; position:absolute; inset:-7px; border-radius:50%; border:3px solid transparent; border-top-color:var(--oc); animation:spin 1s linear infinite; }
  @keyframes breathe { 50% { transform:scale(.8); } }
  @keyframes talk { from { transform:scale(.8); } to { transform:scale(.95); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orb::before, .orb::after { animation:none !important; } }
  .call-st { margin-top:12px; font-size:21px; font-weight:800; letter-spacing:-.01em; }
  .call-sub { margin-top:4px; min-height:42px; max-width:100%; text-align:center; color:var(--muted); font-size:15.5px; line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .call-mute { position:absolute; right:14px; top:14px; width:48px; height:48px; border-radius:50%; background:var(--surface); color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .call-mute.on { background:var(--warn-soft); color:var(--warn); }
  .call-lang { position:absolute; left:14px; top:14px; width:48px; height:48px; border-radius:50%; background:var(--surface); color:var(--ink); font-weight:700; font-size:15px; letter-spacing:.02em; display:flex; align-items:center; justify-content:center; }
  .call[data-state="paused"] .orb { cursor:pointer; }

  .composer { display:flex; gap:10px; align-items:flex-end; padding:8px 12px 0; position:relative; }
  .composer textarea { flex:1; min-width:0; min-height:52px; max-height:150px; resize:none; border-radius:26px; border:1px solid var(--line); background:var(--surface); padding:14px 18px; font-size:17px; line-height:1.3; outline:none; }
  .composer textarea:focus { border-color:var(--accent); background:var(--bg); }
  .composer textarea::placeholder { color:var(--faint); }
  .talk { width:64px; height:64px; flex:none; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; box-shadow:0 6px 22px rgba(86,182,147,.25); }
  .talk:active { transform:scale(.96); }
  .talk.live { background:var(--danger); color:#fff; box-shadow:0 6px 22px rgba(232,112,95,.3); }
  .talk.rec { background:var(--danger); color:#fff; animation:recpulse 1s ease-in-out infinite; }
  .talk.busy { background:var(--warn-soft); color:var(--warn); }
  .send { width:64px; height:64px; flex:none; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; }
  .mic { width:48px; height:48px; border-radius:50%; background:var(--surface-2); color:var(--ink); display:flex; align-items:center; justify-content:center; flex:none; user-select:none; -webkit-user-select:none; touch-action:none; }
  .mic.rec { background:var(--danger); color:#fff; animation:recpulse 1s ease-in-out infinite; }
  .mic.busy { background:var(--warn-soft); color:var(--warn); }
  @keyframes recpulse { 50% { box-shadow:0 0 0 10px rgba(232,112,95,.25); } }
  #recbar { position:fixed; left:8px; right:8px; bottom:calc(var(--sab) + 8px); z-index:80; display:flex; align-items:center; gap:12px; padding:10px; background:var(--raised); border:1px solid var(--line); border-radius:22px; box-shadow:0 -6px 28px rgba(0,0,0,.45); }
  #recbar button { height:58px; border-radius:18px; font-size:18px; font-weight:800; flex:none; }
  #rb-cancel { width:58px; background:var(--surface-2); color:var(--ink); font-size:22px; }
  #rb-go { padding:0 20px; min-width:118px; background:var(--accent); color:var(--accent-ink); }
  #recbar[data-state="failed"] #rb-go { background:var(--warn-soft); color:var(--warn); }
  .rb-mid { flex:1; min-width:0; display:flex; align-items:center; gap:10px; font-size:16.5px; font-weight:700; }
  .rb-mid #rb-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .rb-mid #rb-label:empty { display:none; }
  .rb-dot { width:12px; height:12px; border-radius:50%; background:var(--danger); flex:none; animation:recblink 1.2s ease-in-out infinite; }
  #recbar:not([data-state="rec"]) .rb-dot { background:var(--warn); }
  #recbar[data-state="failed"] .rb-dot { animation:none; }
  #rb-time { font-variant-numeric:tabular-nums; color:var(--muted); flex:none; }
  .rb-lvl { display:flex; align-items:center; gap:3px; height:30px; margin-left:auto; flex:none; }
  .rb-lvl i { width:4px; height:30px; border-radius:2px; background:var(--danger); transform:scaleY(.1); transition:transform .09s linear; }
  #recbar:not([data-state="rec"]) .rb-lvl { display:none; }
  @keyframes recblink { 50% { opacity:.3; } }
  .rbar { padding:8px 14px 0; }

  /* ── the approval deck ────────────────────────────────────────────────────── */
  .deck { position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; padding-left:var(--sal); padding-right:var(--sar); }
  .deck.in { animation:rise .22s ease-out; }
  @keyframes rise { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .deck.in { animation:none; } }
  .dk-head { flex:none; display:flex; align-items:center; gap:10px; padding:calc(var(--sat) + 6px) 14px 6px 6px; }
  .dk-x { width:var(--tap); height:var(--tap); display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:14px; }
  .dk-pos { font-size:15px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .dk-dots { margin-left:auto; display:flex; gap:6px; }
  /* The call stays visible over the deck: a small orb, what it is doing, and the hang-up. */
  .dk-call { margin-left:auto; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 4px 0 12px; border-radius:999px; background:var(--surface); font-size:14px; font-weight:700; --oc:var(--accent); }
  .dk-call + .dk-dots { margin-left:10px; }
  .dk-call i { width:12px; height:12px; border-radius:50%; background:var(--oc); }
  .dk-call[data-state="speaking"] { --oc:var(--blue); } .dk-call[data-state="thinking"], .dk-call[data-state="transcribing"] { --oc:var(--decide); } .dk-call[data-state="paused"], .dk-call[data-state="connecting"] { --oc:#56625A; }
  .dk-call[data-state="listening"] i, .dk-call[data-state="speaking"] i { animation:breathe 1.4s ease-in-out infinite; }
  .dk-hang { width:30px; height:30px; border-radius:50%; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; }
  .dk-dots i { width:7px; height:7px; border-radius:50%; background:var(--line); }
  .dk-dots i.on { background:var(--ink); }
  .dk-track { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; }
  .dk-track::-webkit-scrollbar { display:none; }
  /* pan-y: up/down is the browser's (a long card scrolls); left/right is the deck's own swipe (phone-deck.js
     wireSwipe). On the card AND on its scroller: a browser reads touch-action only up to the nearest scroller. */
  .qcard { flex:0 0 100%; min-width:0; scroll-snap-align:center; scroll-snap-stop:always; display:flex; flex-direction:column; touch-action:pan-y; }
  .dk-nav { display:none; gap:4px; }
  .dk-nav button { width:36px; height:36px; border-radius:10px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .qc-scroll { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; padding:8px 20px 28px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .qc-top { display:flex; align-items:center; gap:10px; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  .qc-ws { display:inline-flex; align-items:center; gap:7px; color:var(--ink); }
  .qc-ws::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--c); }
  .qc-kind { color:var(--accent); }
  .qc-kind.k-question, .qc-kind.k-draft { color:var(--decide); } .qc-kind.k-blocked { color:var(--danger); } .qc-kind.k-review { color:var(--blue); }
  .qc-age { margin-left:auto; color:var(--faint); letter-spacing:0; font-weight:600; text-transform:none; }
  .qc-asked { margin-top:16px; color:var(--muted); font-size:15px; line-height:1.4; overflow-wrap:anywhere; }
  .qc-asked span { display:block; font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:2px; }
  .qc-verdict { margin:10px 0 0; font-size:24px; line-height:1.24; font-weight:800; letter-spacing:-.015em; overflow-wrap:anywhere; }
  .qc-verdict.long { font-size:20px; line-height:1.3; }
  .qc-sec { margin-top:20px; }
  .qc-h { font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin-bottom:8px; display:flex; gap:8px; align-items:baseline; }

  /* ── motion ───────────────────────────────────────────────────────────────── */

  /* ── one terminal (Focus) ─────────────────────────────────────────────────── */

  .fl.say ul, .fl.say ol { margin:0 0 6px; padding-left:20px; }

  /* ── sheets ───────────────────────────────────────────────────────────────── */

  .field input, .field textarea, .field select { width:100%; min-height:52px; border-radius:14px; border:1px solid var(--line); background:var(--bg); padding:12px 14px; font-size:17px; outline:none; -webkit-appearance:none; appearance:none; }

  /* ── a wide screen (the Mac): the same front, one centred column ───────────

    .qc-singles .sg { width:30%; }

    .db { flex:0 1 200px; } .db.later { flex:0 1 150px; } .db.yes { flex:0 1 280px; }

    .fgoal, .fbar, .fcomposer, .strip { padding-left:max(12px, calc((100% - 836px) / 2)); padding-right:max(12px, calc((100% - 836px) / 2)); }
  }
  @media (hover: hover) and (pointer: fine) {

<script src="/assistant-name.js"></script>

<script>
// Chronos on a phone: one conversation with Robert (spoken first, typed as an option) and the things
// waiting for the operator's yes, one card at a time. Terminals, settings and the rest are behind ⋯.
// Same daemon and admin token as /desk.
const qs = (s, r = document) => r.querySelector(s);
const qsa = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// The assistant's name (static/assistant-name.js): rn() for text shown or said, rnH() inside HTML.
const rn = (s) => AssistantName.say(s);
const rnH = () => esc(AssistantName.get());
const WS_SCHEME = location.protocol === "https:" ? "wss:" : "ws:";
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: (k) => { try { localStorage.removeItem(k); } catch {} } };
// The same front on the Mac. EMBED: the Desk opened this page over itself (an iframe on the same
// origin) — it has no history of its own and Esc hands the screen back. DESKTOP is the machine, not
// the window's width: a mouse and no touch means a Mac's microphone and speakers, whatever the size.
const EMBED = (() => { try { return window.parent !== window && window.parent.location.origin === location.origin; } catch { return false; } })();
// The Desk's native window injects the token into its main frame only (desktop/app.swift); a browser
// keeps it in storage. Same token, same login as the Desk — never a second one.
let TOKEN = (() => { try { return (EMBED && window.parent.__MC_TOKEN__) || window.__MC_TOKEN__ || null; } catch { return null; } })() || store.get("mc-token") || null;
// iOS home-screen apps re-ask for the microphone after any navigation, a hash change included, and a
// navigation stops a live capture (WebKit bug 215884). So on iOS the page never touches history: no
// back-button entries, no hashes. Android keeps them — its back gesture closes sheets and screens.
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const USE_HISTORY = !IOS && !EMBED;
const DESKTOP = !IOS && !!window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches;
// What the daemon is told this page is (sticky routing, call presence, call traces, who approved):
// the Desk's front on a Mac, the phone everywhere else.
const SURFACE = DESKTOP ? "desk" : "phone";
// The Desk's ear on a Mac (static/desk.html `const VAD`): a longer pause before a cut, and a lower,
// quicker barge-in — a laptop's speakers leak far less of Robert back than a phone's 10 cm away.
const DESK_VAD = { endMs: 800, barge: 0.06, bargeMs: 300 };
// The Desk's client lock (static/desk-scope.js) shows ONE workspace while the screen is shared. This
// front is every workspace in one conversation and has no lens of its own, so while the lock is on it
// does not draw at all — nothing below runs, nothing is read, nothing cached is shown.
if (DESKTOP && (() => { try { const v = JSON.parse(localStorage.getItem("desk-lock") || "null"); return !!(v && v.id); } catch { return false; } })()) {
  document.getElementById("app").innerHTML = '<div class="locked"><b>Hidden while the Desk shows one workspace</b>' + esc(AssistantName.get()) + '’s conversation spans every workspace. Unlock the Desk to open it.<br><button type="button" id="locked-back">Back to the Desk</button></div>';
  const back = () => { if (EMBED) window.parent.postMessage({ type: "robert:close" }, location.origin); else location.assign("/desk"); };
  document.getElementById("locked-back").onclick = back;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") back(); });
  throw new Error("Robert front: hidden while the Desk is locked to one workspace");
}
// A flaky tunnel throws a network-level TypeError ("Failed to fetch" / "Load failed") before any
// response arrives — cloudflared usually fails over inside a couple seconds. One retry on a GET
// rides that out instead of surfacing it as an error; a write is never silently resent.
const api = (p, opts) => {
  const method = (opts?.method || "GET").toUpperCase();
  const headers = { "content-type": "application/json", ...(TOKEN ? { "x-mc-admin": TOKEN } : {}), ...(opts?.headers || {}) };
  // Closing a terminal is operator-only: this header is the phone's hand (src/authz.ts).
  if (/\/(?:sessions\/[^/]+\/kill|desk\/close-done)$/.test(String(p).split("?")[0])) headers["x-mc-operator"] = "1";
  const send = () => fetch("/api" + p, {
    ...opts,
    headers,
  });
  return send()
    .catch((err) => (method === "GET" && err instanceof TypeError ? new Promise((r) => setTimeout(r, 1200)).then(send) : Promise.reject(err)))
    .then(async (r) => { if (!r.ok) throw Object.assign(new Error((await r.text()).slice(0, 200)), { status: r.status }); return r.status === 204 ? null : r.json(); });
};

let toastT;
function toast(msg, act) {
  const t = qs("#toast"); t.textContent = msg;
  if (act?.fn) { const b = document.createElement("button"); b.textContent = act.label || "Undo"; b.onclick = () => { fx.tap(); t.classList.remove("show"); act.fn(); }; t.appendChild(b); }
  t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), act?.ms || (act ? 5000 : 2400));

    }).catch(() => {});
  }
  if (!bus) connectBus();
}
document.addEventListener("visibilitychange", resume);
window.addEventListener("pageshow", (e) => { if (e.persisted) resume(); });
window.addEventListener("online", () => { robWork(false); resume(); if (!R.busy && R.outbox.length) robRelease(null); });
window.addEventListener("offline", () => robWork(false));

// ── never on a stale build ──────────────────────────────────────────────────
// The page carries its build stamp. When the app comes back, read the stamp of what the daemon now
// serves (the first 2 KB of /phone.html) and, if it moved, reload at once while nothing is going on —
// else show "Update" and reload at the next quiet moment.
const BUILD = document.querySelector('meta[name="chronos-build"]')?.content || "";
let buildAt = 0, newBuild = null;
const quiet = () => !PhoneVoice.on && !V.state && !rComposer.value.trim() && !qs("#sheets").firstChild && !PhoneDeck.isOpen() && !R.busy && !R.outbox.length;
async function checkBuild(force) {
  if (!TOKEN || (!force && Date.now() - buildAt < 5 * 60000)) return;
  buildAt = Date.now();
  try {
    const r = await fetch("/phone.html", { cache: "no-store", headers: { Range: "bytes=0-2047" } });
    if (!r.ok && r.status !== 206) return;
    const head = (await r.text()).slice(0, 4096);
    const m = /name="chronos-build" content="([^"]+)"/.exec(head);
    if (!m || m[1] === BUILD) return;
    newBuild = m[1];
    if (quiet()) return reloadApp();
    qs("#upd").hidden = false;
  } catch {}
}
qs("#upd").onclick = () => { fx.tap(); reloadApp(); };
setInterval(() => { if (newBuild && quiet() && document.visibilityState === "visible" && Date.now() - lastTouch > 30000) reloadApp(); }, 15000);
let lastTouch = Date.now();
document.addEventListener("pointerdown", () => { lastTouch = Date.now(); }, { passive: true, capture: true });

// ── push, badge, service worker ─────────────────────────────────────────────
// The worker (static/sw.js) shows the notification and can answer a prompt from its buttons; it
// needs the admin token for that, handed over here and kept in the worker's own IndexedDB.
const PUSH = (() => {
  let reg = null;
  const ready = async () => {
    if (!("serviceWorker" in navigator)) return null;
    if (!reg) { reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => null); }
    if (reg) { const w = reg.active || reg.waiting || reg.installing; w?.postMessage({ type: "token", token: TOKEN }); navigator.serviceWorker.controller?.postMessage({ type: "token", token: TOKEN }); }
    return reg;
  };
  const b64 = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };
  return {
    ready,
    async status() {
      if (!("Notification" in window) || !("PushManager" in window)) return { on: false, reason: IOS ? "add it to the Home Screen first — iPhone only allows notifications there" : "this browser can't do push" };
      if (!window.isSecureContext) return { on: false, reason: "needs HTTPS" };
      if (Notification.permission === "denied") return { on: false, reason: "blocked in browser settings" };
      const r = await ready(); if (!r) return { on: false, reason: "no service worker" };
      const sub = await r.pushManager.getSubscription();
      return { on: !!sub && Notification.permission === "granted", reason: "" };
    },
    async toggle() {
      const r = await ready(); if (!r) throw new Error("no service worker");
      const cur = await r.pushManager.getSubscription();
      if (cur) { await api("/push/subscribe", { method: "DELETE", body: JSON.stringify({ endpoint: cur.endpoint }) }).catch(() => {}); await cur.unsubscribe(); toast("notifications off"); return false; }
      const perm = await Notification.requestPermission();
      if (perm !== "granted") throw new Error("permission not granted");
      const { publicKey, enabled } = await api("/push/vapid");
      if (enabled === false) throw new Error("push is off on the daemon (CHRONOS_PUSH=0)");
      const sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
      await api("/push/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) });
      fx.success(); toast("notifications on");
      return true;
    },
  };
})();
// Notifications are how stuck work reaches him when the app is closed — and a phone that is not
// subscribed hears nothing. Checked on every launch: subscribed → the subscription is handed to the
// daemon again (it may have dropped it); not → one clear row on the conversation, one tap to fix.
const NR = { hiddenUntil: 0 };
async function checkPush() {
  const row = qs("#nrow"), go = qs("#nr-go");
  let st;
  try { st = await PUSH.status(); } catch { st = { on: false, reason: "" }; }
  if (st.on) {
    row.hidden = true;
    try { const r = await PUSH.ready(); const sub = await r?.pushManager.getSubscription(); if (sub) api("/push/subscribe", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) }).catch(() => {}); } catch {}
    return;
  }
  if (Date.now() < NR.hiddenUntil) return;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (IOS && !standalone && !("PushManager" in window)) {
    if (window.PhoneInstall?.owns("ios")) { row.hidden = true; return; } // its install banner says this, plus the sign-in link
    qs("#nr-t").textContent = rn("Add Robert to your Home Screen");
    qs("#nr-s").textContent = "iPhone only sends alerts to apps on the Home Screen: Share → Add to Home Screen, then open it from there.";
    go.hidden = true;
  } else if (typeof Notification !== "undefined" && Notification.permission === "denied") {
    qs("#nr-t").textContent = "Alerts are blocked";
    qs("#nr-s").textContent = "Allow notifications for this app in Settings — stuck work can't reach you.";
    go.hidden = true;
  } else if (!("PushManager" in window) || typeof Notification === "undefined") {
    qs("#nr-t").textContent = "This browser can't get alerts";
    qs("#nr-s").textContent = st.reason;
    go.hidden = true;
  } else {
    qs("#nr-t").textContent = "Turn on alerts";
    qs("#nr-s").textContent = "So stuck work reaches you with the app closed.";
    go.textContent = "Turn on"; go.hidden = false;
  }
  row.hidden = false;
}
qs("#nr-go").onclick = async () => {
  fx.tap();
  try { await PUSH.toggle(); } catch (err) { fx.fail(); toast(String(err.message).slice(0, 140)); }
  checkPush();
};
qs("#nr-no").onclick = () => { fx.tap(); qs("#nrow").hidden = true; NR.hiddenUntil = Date.now() + 6 * 3600000; };

// App-icon badge: how many things wait for him. Cleared as soon as nothing does.
function badge(n) { try { if (n > 0) navigator.setAppBadge?.(n); else navigator.clearAppBadge?.(); } catch {} }
// Where a notification (or a link) lands: #a=<item> one card in the deck, #s=<session> that
// terminal's card if it has one waiting (else its story), #robert the conversation. Read once at
// launch and then wiped from the address; when the app is already open the worker posts the link
// instead (sw.js) so nothing navigates — a navigation would cost the call and, on iOS, a mic prompt.
function openLink(h) {
  h = String(h || "").replace(/^#/, "");
  if (!h) return;
  const go = async () => {
    if (h.startsWith("a=")) {
      const key = decodeURIComponent(h.slice(2));
      if (!PhoneDeck.loaded()) await PhoneDeck.load();
      if (PhoneDeck.has(key)) return PhoneDeck.open(key);
      // The key moved on (a newer hand-off on the same terminal): its terminal's card, if any.
      const sid = (/^(?:handoff|prompt|blocked):([^:]+)/.exec(key) || [])[1];
      const alt = sid && PhoneDeck.forSession(sid);
      if (alt) return PhoneDeck.open(alt);
      return toast("already handled");
    }
    if (h.startsWith("s=")) {
      const id = h.slice(2);
      if (!PhoneDeck.loaded()) await PhoneDeck.load();
      const key = PhoneDeck.forSession(id);
      if (key) return PhoneDeck.open(key);
      if (byId(id)) return openFocus(id);
      return toast("that terminal is gone");
    }
    if (h.startsWith("robert")) { if (PhoneDeck.isOpen()) PhoneDeck.close(); if (qs("#v-home").hidden) showHome(); toBottom(); }
  };
  if (S.loaded) go(); else document.addEventListener("phone:loaded", go, { once: true });
}
function handleHash() {
  const h = location.hash; if (!h) return;
  history.replaceState(null, "", location.pathname);
  openLink(h);
}
window.addEventListener("hashchange", handleHash);
navigator.serviceWorker?.addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.type === "open" && m.url) { try { openLink(new URL(m.url, location.origin).hash); } catch {} e.ports?.[0]?.postMessage({ ok: true }); }
});

// ── token ───────────────────────────────────────────────────────────────────
function tokenSheet() {
  const b = sheet(`<h3>Sign in</h3><p style="color:var(--muted);margin:0 0 14px">On the Mac, run <span class="mono">npm run desk</span> in your Chronos folder and pair this phone from the Desk — or paste the key from the <span class="mono">.admin-token</span> file in that folder. Stored only in this browser.</p>
    <div class="field"><input id="tok" placeholder="paste token or sign-in link" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="btns"><button class="big primary wide" id="tok-ok">Connect</button></div>`);
  qs("#tok-ok", b).onclick = () => { const t = qs("#tok", b).value.trim(); if (!t) return; if (window.PhoneInstall?.redeemPasted(t)) return; store.set("mc-token", t); TOKEN = t; location.reload(); };
}

// ── boot ────────────────────────────────────────────────────────────────────
// The conversation is on screen before the network answers: the cached thread, the cached count of
// what is waiting, and a draft he was typing. Then everything is read fresh.
(() => {
  const cached = loadThread();
  if (cached.length) { drawThread(cached); R.lastId = cached[cached.length - 1].id || 0; } else hello();
  try {
    const q = JSON.parse(store.get("phone-queue") || "null");
    if (q?.n) { qs("#qentry").hidden = false; qs("#qe-n").textContent = q.n; qs("#qe-t").textContent = q.n === 1 ? "1 waiting for you" : q.n + " waiting for you"; qs("#qe-s").textContent = (PhoneDeck.KIND_WORD[q.kind] || "") + (q.line ? " · " + q.line : ""); }
  } catch {}
  const draft = store.get("phone-draft"); if (draft) { rComposer.value = draft; rComposer.dispatchEvent(new Event("input")); }
  try {
    const p = JSON.parse(store.get("phone-pending") || "null");
    // A line that was on its way when the page went away: it shows as his, waiting, until its row lands.
    if (p?.text && Date.now() - p.at < 10 * 60000) {
      R.pending = p;
      R.mineYou = bubble("you", p.text);
      R.mine = bubble("rob pending", "");
      R.busy = true; robAwait("lost");
    } else store.del("phone-pending");
  } catch {}
  paintCall("off");
  document.documentElement.dataset.ready = "1";
})();
if (!TOKEN) { qs("#top-sub").textContent = "no token"; tokenSheet(); }
else {
  // A reload while a screen or sheet was up leaves its history entry behind; start clean.
  if (history.state?.view || history.state?.sheet || history.state?.deck) history.replaceState(null, "", location.pathname);
  // Alerts by push and the offline shell are the phone's; a Mac has the Desk for both.
  if (!DESKTOP) PUSH.ready().then(checkPush);
  else rComposer.focus();
  handleHash();
  // Warm + prefetch Robert before the first tap — cold Claude is the slow part, not the tunnel.
  warmRobert(true);
  robertHistory();
  load().then(() => {
    connectBus();
  }).catch((err) => {
    qs("#top-sub").textContent = "can't reach the daemon";
    qs("#top-sub").classList.add("warn");
    if (/401|403/.test(err.message)) { store.del("mc-token"); tokenSheet(); } else toast(err.message);
  });
}
</script>
</body>
</html>
