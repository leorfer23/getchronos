[package]
name = "mission-control"
version = "0.1.0"
edition = "2021"
description = "Mission Control desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
